# Site settings
title: Rodrigo Palacios
description: AI engineer and consultant building useful systems across AI, data, and the web.
url: "https://rodricios.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

permalink: /:year/:title.html

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .git
  - .gitignore

plugins:
  - jekyll-feed
  - jekyll-seo-tag
