---
layout: default
---
<article class="article container">
  <a class="back-link" href="{{ '/#writing' | relative_url }}">← Back to writing</a>
  <header class="article-header"><p class="eyebrow">WRITING <span class="article-separator">/</span> {{ page.date | date: "%B %-d, %Y" }}</p><h1>{{ page.title }}</h1>{% if page.excerpt %}<p class="article-deck">{{ page.excerpt | strip_html }}</p>{% endif %}</header>
  {% if page.image %}<img class="article-image" src="{{ page.image }}" alt="" loading="lazy">{% endif %}
  <div class="article-body">{{ content }}</div>
  <div class="article-end"><span>Thanks for reading.</span><a href="{{ '/#writing' | relative_url }}">More writing ↗</a></div>
</article>
